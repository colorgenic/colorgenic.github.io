<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      html,
      body {
        height: 100%;
        width: 100%;
      }
      * {
        padding: 0;
        margin: 0;
      }
      .layout {
        display: flex;

        width: 100%;
        height: 100%;
        border: 1px solid blue;
      }

      @media (min-width: 600px) and (max-aspect-ratio: 2/1) {
        .layout {
          border: 1px solid red;
          width: 50%;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout"></div>
  </body>
</html>
